name: Package and publish

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Verify crates.io package
        run: cargo package --locked

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package name and tag
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(python3 -c 'import json, sys; packages = json.load(sys.stdin)["packages"]; print(next(package["name"] for package in packages if package["name"] == "rusty-alto"))' <<<"${metadata}")"
          crate_version="$(python3 -c 'import json, sys; packages = json.load(sys.stdin)["packages"]; print(next(package["version"] for package in packages if package["name"] == "rusty-alto"))' <<<"${metadata}")"
          test "${crate_name}" = "rusty-alto"
          test "${GITHUB_REF_NAME}" = "v${crate_version}"

      - name: Verify package
        run: cargo publish --dry-run --locked -p rusty-alto

      - name: Publish to crates.io
        run: cargo publish --locked -p rusty-alto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
