[package]
name = "rusty-alto"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
default-run = "rusty-alto"
description = "Weighted tree automata and interpreted regular tree grammars with Alto-compatible I/O"
license = "Apache-2.0"
repository = "https://github.com/coli-saar/rusty-alto"
homepage = "https://github.com/coli-saar/rusty-alto"
documentation = "https://docs.rs/rusty-alto"
readme = "README.md"
keywords = ["tree-automata", "irtg", "parsing", "grammar", "nlp"]
categories = ["algorithms", "parsing", "science"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/README.md",
    "/docs/**",
]

[workspace]
members = [".", "bindings/python"]
resolver = "2"

[dependencies]
fixedbitset = "0.5"
hashbrown = { version = "0.15", features = ["raw-entry"] }
rustc-hash = "2"
packed-term-arena = "0.1.3"
smallvec = "1"
thiserror = "2"
lalrpop-util = "0.23"
indicatif = "0.17"
num-traits = "0.2"

[dev-dependencies]
criterion = "0.5"
num-bigint = "0.4"

[build-dependencies]
lalrpop = "0.23"

[features]
default = []
stats = []
viterbi-benchmark = []
experimental-lazy-astar = []

[[bin]]
name = "ptb-eval"
path = "src/bin/ptb-eval.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[[bench]]
name = "phase1"
harness = false

[[bench]]
name = "sorted_language"
path = "benches/sorted_language/criterion.rs"
harness = false

[[bench]]
name = "sorted_language_scaling"
path = "benches/sorted_language/scaling.rs"
harness = false

[[bench]]
name = "sorted_language_memory"
path = "benches/sorted_language/memory.rs"
harness = false

[profile.release-optimized]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
